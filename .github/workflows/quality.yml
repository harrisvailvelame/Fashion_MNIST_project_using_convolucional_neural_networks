name: repository-quality

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate notebook JSON
        run: python -m json.tool keras_fashion_mnist_dp_cnn_pedrohv.ipynb > /dev/null
      - name: Compile repository Python where applicable
        run: python -m compileall -q .
