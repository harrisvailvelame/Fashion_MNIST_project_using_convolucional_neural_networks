name: repository-quality

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate notebook JSON
        run: python -m json.tool fashion_mnist_cnn.ipynb > /dev/null
      - name: Compile repository Python where applicable
        run: python -m compileall -q .
